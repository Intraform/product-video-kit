<!doctype html>
<title>Flow graph with a run</title>
<meta charset="utf-8">
<!-- Flow editor graph (nodes, edges) plus run panels beside each step. Source: lib/components/graph/ (node 275x34, radius 6, Input/Result #dce0f1, edges #b1b1b7, canvas #efeff4). The run panels are a clip device, not app UI. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root { --bg: #eef4ff; --ink: #111827; --text: #374151; --muted: #9ca3af; --line: #ececea; --edge: #e3e7ef; --blue: #3b82f6; --blue2: #2c5beb; --soft: #eef3fe; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #dde5f3; overflow: hidden; }
  body { display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); transform-origin: 0 0; }
    .abs { position: absolute; }
  .ico { display: inline-grid; place-items: center; width: 18px; height: 18px; flex: none; }
  .ico svg { width: 100%; height: 100%; }
  .lu { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .float { position: absolute; background: #fff; border: 1px solid var(--edge); box-shadow: 0 1px 2px rgba(17,24,39,.04), 0 24px 48px -24px rgba(29,36,48,.28); }
  .ok { width: 16px; height: 16px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; flex: none; }
  .ok::after { content: ""; width: 7px; height: 3.5px; border: solid #fff; border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }

  /* the workflow, drawn as the flow editor draws it */
  #G { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 895px 360px; }
  .gz { position: absolute; left: 702.5px; top: 159.8px; transform: scale(1.4); transform-origin: 0 0; }
  .gn { position: absolute; width: 275px; height: 34px; border-radius: 6px; background: #fff; box-shadow: 0 1px 2px rgba(17,24,39,.06), 0 10px 22px -12px rgba(29,36,48,.3); display: flex; align-items: center; justify-content: space-between; padding: 8px; font-size: 11.2px; color: #1d2430; }
  .gn.virt { background: #dce0f1; justify-content: center; }
  .gn .lbl { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; }
  .gn .bid { background: #dce0f1; border-radius: 6px; padding: 2px 4px; font-size: 11.2px; line-height: 1; }
  .gn .ok { position: absolute; right: -24px; top: 9px; }
  .gn.glow { box-shadow: 0 0 0 2px rgba(59,130,246,.55), 0 10px 22px -12px rgba(29,36,48,.3); }
  svg.gedges { position: absolute; left: 0; top: 0; overflow: visible; }
  .gdot { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--blue2); box-shadow: 0 0 0 3px rgba(59,130,246,.22); }

  /* the run panels */
  .run { left: 665px; width: 400px; border-radius: 12px; padding: 12px 16px; overflow: hidden; }
  .run .rh { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .run .mono { margin-top: 10px; font: 400 14px 'JetBrains Mono', monospace; color: var(--ink); }
  .run .th { margin-top: 9px; font-size: 15px; color: var(--text); }
  .run .tool { margin-top: 10px; display: flex; align-items: center; gap: 8px; font: 500 13.5px 'JetBrains Mono', monospace; color: var(--ink); }
  .run .out { margin-top: 9px; font-size: 16px; font-weight: 500; color: var(--ink); }

  /* the state shown: the run done, panels open beside their steps */
  #G { transform: translateX(-480px); } .gn .ok { opacity: 1 !important; } .gdot { display: none; } #e1, #e2 { stroke: #3b82f6; stroke-width: 1.6; }

</style>

        <path id="e2" d="M137.5 160 V 222" stroke="#b1b1b7" stroke-width="1" fill="none"/>
      </svg>
      <div class="gn virt" id="nIn" style="left:0;top:30px"><span class="lbl">Input</span><span class="ok" style="opacity:0"></span></div>
      <div class="gn" id="nAg" style="left:0;top:126px"><svg class="lu" style="color:#a02cde"><use href="#i-bot"/></svg><span class="lbl">Order assistant</span><span class="bid">a</span><span class="ok" style="opacity:0"></span></div>

</div>
<script src="../icons.js"></script>
<script>
  document.querySelectorAll("[data-icon]").forEach((el, n) => {
    const svg = window.CLIP_ICONS?.[el.dataset.icon];
    if (svg) el.innerHTML = svg.replace(/\bid="([^"]+)"/g, `id="$1-${n}"`).replace(/url\(#([^)]+)\)/g, `url(#$1-${n})`).replace(/href="#([^"]+)"/g, `href="#$1-${n}"`);
  });
  const fit = () => { const s = Math.min(innerWidth / 1280, innerHeight / 720); document.querySelector("#stage").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
</script>
