<!doctype html>
<title>Support desk app</title>
<meta charset="utf-8">
<!-- A full-code app as a scene uses it (one ticket, a drafted reply, Draft reply / Send). Not a Windmill screen: an app a user would build. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root { --bg: #eef4ff; --ink: #111827; --text: #374151; --muted: #9ca3af; --line: #ececea; --edge: #e3e7ef; --blue: #3b82f6; --blue2: #2c5beb; --soft: #eef3fe; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #dde5f3; overflow: hidden; }
  body { display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); transform-origin: 0 0; }
    .abs { position: absolute; }
  .ico { display: inline-grid; place-items: center; width: 18px; height: 18px; flex: none; }
  .ico svg { width: 100%; height: 100%; }
  .lu { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .float { position: absolute; background: #fff; border: 1px solid var(--edge); box-shadow: 0 1px 2px rgba(17,24,39,.04), 0 24px 48px -24px rgba(29,36,48,.28); }
  .ok { width: 16px; height: 16px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; flex: none; }
  .ok::after { content: ""; width: 7px; height: 3.5px; border: solid #fff; border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }

  /* the support desk app */
  .app { left: 640px; top: 170px; width: 520px; height: 310px; border-radius: 14px; overflow: hidden; }
  .app .bar { height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid #eef0f4; font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .app .bar .sp { flex: 1; }
  .app .pill { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--blue2); background: #eef3fe; padding: 5px 11px 5px 7px; border-radius: 999px; }
  .app .who { padding: 18px 20px 0; font-size: 14px; color: var(--muted); }
  .app .who b { color: var(--ink); font-weight: 600; margin-right: 6px; }
  .app .aq { padding: 4px 20px 0; font-size: 21px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  .app .box { position: relative; margin: 14px 20px 0; height: 80px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 17px; line-height: 1.45; color: var(--ink); }
  .app .box .ph { position: absolute; left: 14px; top: 12px; color: var(--muted); }
  .app .box .w { opacity: 0; }
  .app .drafting { position: absolute; left: 20px; bottom: 28px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  .app .drafting i { width: 7px; height: 7px; border-radius: 50%; background: #a02cde; }
  .app .acts { position: absolute; right: 20px; bottom: 20px; display: flex; gap: 10px; }
  .app .btn { height: 36px; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 8px; font-size: 13.5px; font-weight: 600; }
  .app .draft { width: 130px; background: #fff; border: 1px solid #dfe3eb; color: var(--ink); }
  .app .send { width: 72px; background: var(--blue2); color: #fff; }


  .app .box .ph, .app .drafting { opacity: 0; }

</style>

<div id="stage">
  <!-- the support desk -->
  <div class="float app" id="app">
    <div class="bar"><span class="ico" data-icon="zendesk"></span>Support desk<span class="sp"></span><span class="pill" id="solved"><i class="ok"></i>Solved</span></div>
    <div class="who"><b>Maya Lopez</b>just now</div>
    <div class="aq">Where is my order?</div>
    <div class="box"><span class="ph" id="ph">Write a reply…</span><span id="rtext">Hi Maya, it shipped yesterday with UPS. It arrives on Friday.</span></div>
    <div class="drafting" id="drafting"><i></i>Order assistant is drafting</div>
    <div class="acts"><span class="btn draft" id="bDraft"><svg class="lu" style="color:#a02cde;width:15px;height:15px"><use href="#i-bot"/></svg>Draft reply</span><span class="btn send" id="bSend">Send</span></div>
  </div>


</div>
<script src="../icons.js"></script>
<script>
  document.querySelectorAll("[data-icon]").forEach((el, n) => {
    const svg = window.CLIP_ICONS?.[el.dataset.icon];
    if (svg) el.innerHTML = svg.replace(/\bid="([^"]+)"/g, `id="$1-${n}"`).replace(/url\(#([^)]+)\)/g, `url(#$1-${n})`).replace(/href="#([^"]+)"/g, `href="#$1-${n}"`);
  });
  const fit = () => { const s = Math.min(innerWidth / 1280, innerHeight / 720); document.querySelector("#stage").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
</script>
